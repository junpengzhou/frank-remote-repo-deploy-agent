workspace: /data/salt-agent
buildRoot: /data/salt-agent/build
stagingDir: /data/salt-agent/staging
cacheFile: /data/salt-agent/cache/build-cache.json
lockDir: /data/salt-agent/locks

jdk:
  javaHome: /usr/local/jdk-21

maven:
  executable: mvn
  settings: /opt/maven/conf/settings.xml
  localRepo: /data/salt-agent/.m2/repository
  extraArgs:
    - -Dmaven.test.skip=true

ssh:
  user: root
  host: 10.0.0.1
  port: 22
  keyFile: /home/Salt/.ssh/id_rsa

rsync:
  executable: rsync
  options:
    - -az
    - --delete
    - --partial

environments:
  test:
    branch: test
  prod:
    branch: master

modules:
  example-common:
    repo: git@gitlab.example.com:example/example-common.git
    packaging: jar

  example-common1:
    repo: git@gitlab.example.com:example/example-common1.git
    packaging: jar

  example-common2:
    repo: git@gitlab.example.com:example/example-common2.git
    packaging: jar

  example-simple:
    repo: git@gitlab.example.com:example/example-simple.git
    packaging: war
    dependencies:
      - example-common
      - example-common1
      - example-common2
    remotePath: /data/xxx/example-simple/
    container: simple
    logFile: /data/xxx/logs/example-simple/catalina.out
    # remoteScript can be used for a custom post-sync hook.
    # When omitted, the agent runs: docker restart <container>
