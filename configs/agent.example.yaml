workspace: /data/salt-agent
buildRoot: /data/salt-agent/build
stagingDir: /data/salt-agent/staging
cacheFile: /data/salt-agent/cache/build-cache.json
lockDir: /data/salt-agent/locks

jdk:
  javaHome: /usr/local/jdk-21

maven:
  executable: mvn
  settings: /opt/maven/conf/settings.xml
  localRepo: /data/salt-agent/.m2/repository
  extraArgs:
    - -Dmaven.test.skip=true

ssh:
  user: root
  host: 10.0.0.1
  port: 22
  keyFile: /home/Salt/.ssh/id_rsa
  # connectTimeout is passed to SSH as ConnectTimeout.
  connectTimeout: 10s

rsync:
  executable: rsync
  options:
    - -az
    - --delete
    - --partial
  # retries is the number of extra rsync attempts after the first failure.
  retries: 3
  retryDelay: 5s

environments:
  test:
    branch: test
    # mavenProfile can be used for a custom maven profile if configured.
    mavenProfile: test
  prod:
    branch: master

modules:
  example-common:
    repo: git@gitlab.example.com:example/example-common.git
    packaging: jar

  example-common1:
    repo: git@gitlab.example.com:example/example-common1.git
    packaging: jar

  example-common2:
    repo: git@gitlab.example.com:example/example-common2.git
    packaging: jar

  example-simple:
    repo: git@gitlab.example.com:example/example-simple.git
    packaging: war
    dependencies:
      - example-common
      - example-common1
      - example-common2
    remotePath: /data/xxx/example-simple/
    container: simple
    logFile: /data/xxx/logs/example-simple/catalina.out
    # healthUrl enables startup health checks. HTTP 200 means the app is ready.
    healthUrl: http://127.0.0.1:8080/actuator/health
    # healthTimeout defaults to 2m when omitted. Use Go duration values like 30s, 2m, or 5m.
    healthTimeout: 2m
    # remoteScript can be used for a custom post-sync hook.
    # When omitted, the agent runs: docker restart <container>
